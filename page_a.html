<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>kittichet phiriyaphatchararat Profile</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Monomaniac+One&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <style>
        body {
            background-color: #050505;
            margin: 0;
            padding: 0;
        }

        a {
            text-decoration: none;
            color: white;
            font-size: 1.5rem;
        }

        .menu a {
            font-family: 'Monomaniac One', sans-serif;
        }

        .nav-bar {
            display: flex;
            align-items: center;
            margin: 75px 150px;
        }

        .menu,
        .icon,
        .logo {
            width: 100%;
            display: flex;
        }

        .menu {
            justify-content: start;
            gap: 50px;
        }

        .icon {
            justify-content: end;
            gap: 20px;
        }

        a:hover {
            color: #01D5A2;
        }

        .logo {
            justify-content: center;
        }

        span {
            color: white;
            font-family: 'Monomaniac One';
            font-size: 1.5rem;
            align-items: center;
        }

        .p-job span {
            color: #01D5A2;
            align-items: center;
        }

        .profile-info {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 120px;

        }

        .profile-picture img{
            width: 280px;
            border-radius: 100%;
            border: 2px solid #01D5A2;
            padding: 20px;
            
        }
    </style>
</head>

<body>
    <!-- ส่วนของ nav-bar -->
    <div class="nav-bar">
      <!-- ส่วนของ menu -->
      <div class="menu">
        <a href="#">Protfolio</a>
        <a href="#">About Me</a>
        <a href="#">Get In Touch</a>
      </div>
      <!-- ส่วนของ logo -->
      <div class="logo">
        <img src="./image/a1.png" alt="" />
      </div>
      <!-- ส่วนของ icon -->
      <div class="icon">
        <a href="#"><i class="bi bi-github"></i></a>
        <a href="#"><i class="bi bi-instagram"></i></a>
        <a href="#"><i class="bi bi-twitter"></i></a>
        <a href="#"><i class="bi bi-linkedin"></i></a>
      </div>
    </div>
 
    <!-- ส่วนของ profile-info -->
    <div class="profile-info">
      <div class="p-name">
        <span>Kittichet phiriyaphatchararat</span>
      </div>
      <div class="p-job">
        <span>Freelance Web Developer</span>
      </div>
      <div class="p-state">
        <span>Based In THAILAND</span>
      </div>
    </div>
 
    <!-- ส่วนของ profile-picture -->
    <div class="profile-picture"></div>
    <img src="./image/a2.png" alt="a1" />
  </body>
</html>
